<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='chat.css') }}">
  <style>
    /* Ensure same background and button style as index */
    body { background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%); }
    .btn { background: linear-gradient(90deg, #ff7e5f, #feb47b); color: white; border: none; padding: 0.8rem; font-size: 1rem; border-radius: 10px; cursor: pointer; transition: 0.3s; }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 4px 10px rgba(255, 126, 95, 0.4); }
    .notif-container{position:fixed;top:16px;right:16px;z-index:10000;display:flex;flex-direction:column;gap:8px}
    .notif{min-width:220px;padding:10px 14px;border-radius:8px;color:#fff;box-shadow:0 6px 18px rgba(0,0,0,.12);opacity:0;transform:translateY(-8px);transition:all .22s}
    .notif.show{opacity:1;transform:none}
    .notif.success{background:#28a745}
    .notif.error{background:#d9534f}
    .notif.info{background:#007bff}
  </style>
</head>
<body>
  <div id="notif-container" aria-live="polite" class="notif-container"></div>
  <div class="header-actions">
    {% if session.get('username') %}
      <span style="margin-right:6px;">Halo, <strong>{{ session.get('username') }}</strong></span>
      <a class="btn" href="{{ url_for('logout') }}">Logout</a>
    {% else %}
      <a class="btn" href="{{ url_for('login') }}">Login</a>
      <a class="btn" href="{{ url_for('register') }}">Register</a>
    {% endif %}
  </div>
  {% if session.get('role') == 'admin' %}
    <div class="admin-link">
      <a class="btn" href="{{ url_for('admin_panel') }}">Admin</a>
    </div>
  {% endif %}
  <div class="container">
    <header>
      <h1>🔐 Login</h1>
      <p class="subtitle">Masuk untuk menyimpan dan melihat favorit</p>
    </header>

    <form id="login-form" class="resep-form">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" required>

      <label for="password">Password</label>
      <input type="password" id="password" name="password" required>

      <button type="submit" class="btn">Login</button>
    </form>

    <p style="text-align:center;margin-top:16px;">Belum punya akun? <a href="{{ url_for('register') }}">Daftar</a></p>

    <a href="/" class="back-btn">🔙 Kembali ke Beranda</a>
  </div>
  <!-- SmartchefAI widget -->
  <div id="smartchef-widget">
    <div class="sc-toggle">Chat</div>
    <div class="sc-window hidden">
      <div class="sc-header">SmartchefAI <button class="sc-close">×</button></div>
      <div class="sc-messages"></div>
      <form class="sc-form">
        <input class="sc-input" type="text" placeholder="Tanya tentang bahan atau resep...">
        <button class="sc-send" type="submit">Kirim</button>
      </form>
    </div>
  </div>
  <script>
    const API_BASE = 'http://127.0.0.1:8000/api/auth';
    function showNotif(type, message, timeout = 3500){
      const c = document.getElementById('notif-container');
      if(!c) return null;
      const el = document.createElement('div');
      el.className = `notif ${type}`;
      el.textContent = message;
      el.setAttribute('role','status');
      c.appendChild(el);
      requestAnimationFrame(()=> el.classList.add('show'));
      if(timeout>0){
        setTimeout(()=>{ el.classList.remove('show'); setTimeout(()=> el.remove(),220); }, timeout);
      }
      return el;
    }

    document.getElementById('login-form').addEventListener('submit', async function(e) {
      e.preventDefault();
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const btn = this.querySelector('button[type="submit"]');
      const origText = btn.textContent;
      btn.disabled = true;
      btn.textContent = 'Memproses...';
      try {
        const res = await fetch(`${API_BASE}/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          showNotif('error', err.detail || 'Login gagal');
          btn.disabled = false;
          btn.textContent = origText;
          return;
        }
        const data = await res.json();
        // sinkronisasi session Flask agar template mengenali user
        await fetch('/auth/sync', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: data.username, role: data.role })
        }).catch(() => {});
        showNotif('success', `Halo, ${data.username}! Login berhasil.`);
        setTimeout(()=> window.location.href = '/', 700);
      } catch (err) {
        showNotif('error', 'Terjadi kesalahan: ' + (err.message || err));
        btn.disabled = false;
        btn.textContent = origText;
      }
    });
  </script>
  <script src="{{ url_for('static', filename='chat.js') }}"></script>
</body>
</html>
